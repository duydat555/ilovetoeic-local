name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Pin the runner so GitHub's ubuntu-latest migration cannot change the
    # production deployment environment without an explicit review.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 \
            "$HOME/.ssh/id_ed25519" \
            "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH connection successful'"

      - name: Deploy application
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: /var/www/toeic-website
        run: |
          set -Eeuo pipefail

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          # Ngăn hai tiến trình deploy chạy cùng lúc trên VPS.
          exec 9>/tmp/toeic-production-deploy.lock
          if ! flock -n 9; then
            echo "Another deployment is already running."
            exit 1
          fi

          echo "==> Updating source code"
          cd "$DEPLOY_PATH"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Repository contains uncommitted changes:"
            git status --short
            exit 1
          fi

          # Ensure GitHub SSH uses port 443 to avoid port 22 timeout / ISP blocks
          mkdir -p "$HOME/.ssh"
          touch "$HOME/.ssh/config"
          if ! grep -q "ssh.github.com" "$HOME/.ssh/config"; then
            printf '%s\n' \
              '' \
              'Host github.com' \
              '    Hostname ssh.github.com' \
              '    Port 443' \
              '    User git' \
              '    StrictHostKeyChecking accept-new' \
              '    ServerAliveInterval 15' \
              '    ServerAliveCountMax 3' \
              '    ConnectTimeout 15' \
              >> "$HOME/.ssh/config"
            chmod 600 "$HOME/.ssh/config"
          fi

          echo "==> Fetching latest changes from GitHub"
          FETCH_OK=0
          for attempt in 1 2 3 4 5; do
            if git fetch origin main; then
              FETCH_OK=1
              break
            fi
            echo "Fetch attempt $attempt failed. Retrying in 5 seconds..."
            sleep 5
          done

          if [ "$FETCH_OK" -ne 1 ]; then
            echo "Failed to fetch from GitHub after 5 attempts."
            exit 1
          fi

          git checkout main
          git merge --ff-only origin/main

          echo "==> Creating database backup"
          install -d -m 700 /var/backups/toeic

          BACKUP_FILE="/var/backups/toeic/toeic_db_$(date +%Y%m%d_%H%M%S).sql"

          # Lệnh này yêu cầu root MySQL đã được cấu hình đăng nhập
          # bằng Unix socket hoặc file /root/.my.cnf.
          mysqldump \
            --user=root \
            --single-transaction \
            --routines \
            --events \
            --triggers \
            toeic_db > "$BACKUP_FILE"

          chmod 600 "$BACKUP_FILE"
          gzip "$BACKUP_FILE"
          test -s "$BACKUP_FILE.gz"
          gzip -t "$BACKUP_FILE.gz"
          echo "Verified database backup: $BACKUP_FILE.gz"

          # Chỉ giữ backup trong 14 ngày.
          find /var/backups/toeic \
            -type f \
            -name 'toeic_db_*.sql.gz' \
            -mtime +14 \
            -delete

          echo "==> Loading database configuration"
          cd "$DEPLOY_PATH/server"

          if [ ! -f .env ]; then
            echo "Missing server/.env"
            exit 1
          fi

          DBPASS="$(
            python3 - <<'PY'
          from pathlib import Path

          for line in Path(".env").read_text(encoding="utf-8").splitlines():
              line = line.strip()

              if not line or line.startswith("#") or "=" not in line:
                  continue

              key, value = line.split("=", 1)

              if key.strip() == "DB_PASSWORD":
                  value = value.strip()

                  if len(value) >= 2 and value[0] == value[-1] \
                          and value[0] in {"'", '"'}:
                      value = value[1:-1]

                  print(value)
                  break
          PY
          )"

          if [ -z "$DBPASS" ]; then
            echo "DB_PASSWORD is missing from server/.env"
            exit 1
          fi

          export MYSQL_PWD="$DBPASS"

          echo "==> Preparing migration history"
          mysql \
            --host=127.0.0.1 \
            --user=toeic_app \
            toeic_db <<'SQL'
          CREATE TABLE IF NOT EXISTS schema_migrations (
              version VARCHAR(255) NOT NULL PRIMARY KEY,
              applied_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          SQL

          echo "==> Applying database migrations"
          if [ -d migrations ]; then
            while IFS= read -r -d '' migration; do
              version="$(basename "$migration")"

              applied="$(
                mysql \
                  --host=127.0.0.1 \
                  --user=toeic_app \
                  --batch \
                  --skip-column-names \
                  toeic_db \
                  -e "SELECT COUNT(*) FROM schema_migrations WHERE version = '$version'"
              )"

              if [ "$applied" = "0" ]; then
                echo "Applying migration: $version"

                mysql \
                  --host=127.0.0.1 \
                  --user=toeic_app \
                  toeic_db < "$migration"

                mysql \
                  --host=127.0.0.1 \
                  --user=toeic_app \
                  toeic_db \
                  -e "INSERT INTO schema_migrations (version) VALUES ('$version')"
              else
                echo "Skipping applied migration: $version"
              fi
            done < <(
              find migrations \
                -maxdepth 1 \
                -type f \
                -name '*.sql' \
                -print0 |
              sort -z
            )
          fi

          echo "==> Installing backend dependencies"
          if [ ! -x .venv/bin/python ]; then
            echo "Missing server/.venv"
            exit 1
          fi

          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt
          .venv/bin/python -m compileall -q app main.py

          echo "==> Importing Grammar data"
          GRAMMAR_IMPORT_VERSION="20260812_02_import_grammar_csv"
          GRAMMAR_IMPORT_APPLIED="$(
            mysql \
              --host=127.0.0.1 \
              --user=toeic_app \
              --batch \
              --skip-column-names \
              toeic_db \
              -e "SELECT COUNT(*) FROM schema_migrations WHERE version = '$GRAMMAR_IMPORT_VERSION'"
          )"

          if [ "$GRAMMAR_IMPORT_APPLIED" = "0" ]; then
            .venv/bin/python import_grammar_csv.py data/grammar_questions_flat.csv

            mysql \
              --host=127.0.0.1 \
              --user=toeic_app \
              toeic_db \
              -e "INSERT INTO schema_migrations (version) VALUES ('$GRAMMAR_IMPORT_VERSION')"
          else
            echo "Skipping applied Grammar import: $GRAMMAR_IMPORT_VERSION"
          fi

          unset DBPASS MYSQL_PWD

          echo "==> Building frontend"
          cd "$DEPLOY_PATH/client"

          npm ci --no-audit --no-fund
          # Production rollout; documented defaults remain disabled elsewhere.
          export VITE_EXAM_ANNOTATIONS_V2=true
          export VITE_EXAM_NOTES_V2=true
          npm run build

          echo "==> Enabling durable exam notes"
          # Preserve the environment securely before changing only this flag.
          python3 - <<'PY'
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ['DEPLOY_PATH']) / 'server' / '.env'
          backup = Path('/var/backups/toeic') / ('server_env_' + datetime.now(timezone.utc).strftime('%Y%m%d_%H%M%S') + '.bak')
          shutil.copy2(path, backup)
          backup.chmod(0o600)
          lines = [line for line in path.read_text().splitlines()
                   if line.partition('=')[0].strip() not in ('EXAM_NOTES_ENABLED', 'export EXAM_NOTES_ENABLED')]
          lines.append('EXAM_NOTES_ENABLED=true')
          path.write_text('\n'.join(lines) + '\n')
          PY

          echo "==> Restarting services"
          systemctl restart toeic-api
          systemctl reload nginx

          systemctl is-active --quiet toeic-api
          systemctl is-active --quiet nginx
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 2 --max-time 10 \
            http://127.0.0.1:8000/api/v1/status > /dev/null

          echo "Deployment completed successfully."
          REMOTE_SCRIPT
