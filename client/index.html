<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/icons/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ilovetoeic - Chinh Phục TOEIC Theo Lộ Trình Cá Nhân Hóa</title>
    <script>
      try {
        if (localStorage.getItem('toeic_master_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {
        // Light mode remains the default when storage is unavailable.
      }

      try {
        var rawSettings = localStorage.getItem('display_settings');
        if (rawSettings) {
          var ds = JSON.parse(rawSettings);
          var rootEl = document.documentElement;
          if (ds.fontSizeScale) {
            var scaleMap = { 90: 0.80, 100: 1.00, 110: 1.15, 125: 1.30 };
            var sc = Object.prototype.hasOwnProperty.call(scaleMap, ds.fontSizeScale) ? scaleMap[ds.fontSizeScale] : 1;
            rootEl.style.setProperty('--app-font-scale', String(sc));
            rootEl.style.fontSize = 'calc(100% * var(--app-font-scale, 1))';
          }
          if (ds.fontFamily) {
            rootEl.style.setProperty('--app-font-family', '"' + ds.fontFamily + '", "Inter", "Be Vietnam Pro", system-ui, sans-serif');
            var cleanFont = ds.fontFamily.trim();
            if (cleanFont && cleanFont !== 'Inter' && cleanFont !== 'Be Vietnam Pro') {
              var linkId = 'google-font-' + cleanFont.toLowerCase().replace(/[^a-z0-9]/g, '-');
              var fontUrl = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(cleanFont) + ':wght@300;400;500;600;700&display=swap';
              var linkEl = document.createElement('link');
              linkEl.id = linkId;
              linkEl.rel = 'stylesheet';
              linkEl.href = fontUrl;
              document.head.appendChild(linkEl);
            }
          }
          if (ds.fontWeight) {
            rootEl.style.setProperty('--app-font-weight', String(ds.fontWeight));
          }
        }
      } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root">
      <main id="app-boot" style="min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f8fafc;color:#0f172a;font:16px/1.6 system-ui,sans-serif">
        <div style="max-width:440px">
          <h1 id="app-boot-title" style="font-size:24px;line-height:1.3;margin:0 0 12px">Đang mở ilovetoeic</h1>
          <p id="app-boot-message" role="status">Vui lòng chờ trong giây lát. Nếu kết nối chậm, bạn có thể thử tải lại trang.</p>
          <button id="app-boot-reload" type="button" style="min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid #cbd5e1;background:#ffc72c;color:#0f172a;font:inherit;cursor:pointer">Tải lại trang</button>
          <noscript><p>Bạn cần bật JavaScript trong trình duyệt để sử dụng trang web.</p></noscript>
        </div>
      </main>
    </div>
    <script>
      // This remains usable even when the entry bundle itself cannot load.
      document.getElementById('app-boot-reload').addEventListener('click', function () { location.reload(); });
      function showBootFailure() {
        var boot = document.getElementById('app-boot');
        if (!boot) return;
        boot.setAttribute('role', 'alert');
        document.getElementById('app-boot-title').textContent = 'Chưa thể mở trang';
        document.getElementById('app-boot-message').textContent = 'Kết nối có thể bị gián đoạn hoặc trang vừa được cập nhật. Bạn hãy thử tải lại.';
      }
      window.addEventListener('error', function (event) {
        if (event.target instanceof HTMLScriptElement || event.target === window) showBootFailure();
      }, true);
      setTimeout(showBootFailure, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
