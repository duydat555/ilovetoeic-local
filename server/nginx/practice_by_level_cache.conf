# Nginx Reverse Proxy Cache Configuration for Practice by Level
# Include this configuration in the Nginx server block for ilovetoeic.com

# -----------------------------------------------------------------------------
# STEP 1: Add to /etc/nginx/nginx.conf (inside the `http` block):
# -----------------------------------------------------------------------------
# proxy_cache_path /var/cache/nginx/practice_levels
#     levels=1:2
#     keys_zone=PRACTICE_LEVEL_CACHE:50m
#     max_size=500m
#     inactive=60m
#     use_temp_path=off;
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# STEP 2: Add to /etc/nginx/sites-available/ilovetoeic.com (inside `server` block):
# -----------------------------------------------------------------------------

# Cache Summary endpoint (/api/v1/practice-by-level/summary)
location /api/v1/practice-by-level/summary {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Shared proxy cache settings
    proxy_cache PRACTICE_LEVEL_CACHE;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 180s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;

    # Bypass cache if admin specifies ?nocache=1 or sends X-Purge-Cache header
    proxy_cache_bypass $arg_nocache $http_x_purge_cache;
    proxy_no_cache $arg_nocache $http_x_purge_cache;

    # Inform client of cache status (HIT, MISS, BYPASS, EXPIRED)
    add_header X-Cache-Status $upstream_cache_status always;
}

# Cache Questions endpoint (/api/v1/practice-by-level/questions)
# Includes full query string (part, level, response_format) in proxy_cache_key
location /api/v1/practice-by-level/questions {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Shared proxy cache settings
    proxy_cache PRACTICE_LEVEL_CACHE;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 180s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;

    # Bypass cache if admin specifies ?nocache=1 or sends X-Purge-Cache header
    proxy_cache_bypass $arg_nocache $http_x_purge_cache;
    proxy_no_cache $arg_nocache $http_x_purge_cache;

    # Inform client of cache status (HIT, MISS, BYPASS, EXPIRED)
    add_header X-Cache-Status $upstream_cache_status always;
}
